  details.q { border: 1px solid var(--line); border-radius: 8px; margin: .6rem 0; background: var(--bg); }

                        gap: .5rem; align-items: baseline; list-style: none; }
  details.q > summary::-webkit-details-marker { display: none; }
  details.q[open] > summary { border-bottom: 1px solid var(--line); }
  .qid { font-family: ui-monospace, monospace; color: var(--accent); }
  .tag { font-size: .72rem; border: 1px solid var(--line); border-radius: 999px;
         padding: .05rem .5rem; color: var(--muted); }
  .tag.failtag { border-color: var(--fail); color: var(--fail); font-weight: 600; }
  .tag.contam { border-color: var(--major); color: var(--major); }
  .qtext { flex: 1 1 100%; }
  .body { padding: .8rem; }
  .cond { border: 1px solid var(--line); border-radius: 6px; margin: .6rem 0; }
  .cond > .condhead { padding: .4rem .7rem; background: var(--card); font-size: .8rem;
                      display: flex; gap: 1rem; flex-wrap: wrap; }
  .cols { display: flex; flex-wrap: wrap; gap: 1rem; padding: .7rem; }
  .reply { flex: 2 1 26rem; min-width: 0; white-space: pre-wrap; overflow-wrap: break-word;

  .checks { flex: 1 1 20rem; min-width: 0; font-size: .82rem; }
  .check { border-left: 3px solid var(--line); padding: .3rem .6rem; margin: .4rem 0; }
  .check.fail { border-left-color: var(--fail); }
  .check.pass { border-left-color: var(--pass); }
  .check .why { color: var(--muted); }

  .check .src { color: var(--muted); font-style: italic; }
  .keybox, .sources { font-size: .82rem; color: var(--muted); margin: .3rem 0 .5rem; }
  .keybox b { color: var(--fg); }
  code { font-family: ui-monospace, monospace; font-size: .85em; }

<script id="data" type="application/json">{"generated":"2026-07-19T19:27:13.934Z","conditions":[{"condition":"baseline","dates":["2026-07-18","2026-07-19"],"models":["claude-opus-4-8"]}],"philosophers":["aquinas","nietzsche","kierkegaard","sartre","camus"],"overview":{"baseline":{"aquinas":{"bySev":{"critical":{"pass":23,"fail":0},"major":{"pass":48,"fail":3},"minor":{"pass":11,"fail":7}},"byCat":{"known-answer":{"pass":15,"fail":5},"locate":{"pass":10,"fail":1},"trap-attribution":{"pass":11,"fail":1},"trap-confusion":{"pass":18,"fail":0},"misreading":{"pass":12,"fail":2},"depth":{"pass":16,"fail":1}}},"nietzsche":{"bySev":{"critical":{"pass":25,"fail":1},"major":{"pass":33,"fail":3},"minor":{"pass":13,"fail":5}},"byCat":{"known-answer":{"pass":18,"fail":4},"locate":{"pass":9,"fail":1},"trap-attribution":{"pass":13,"fail":2},"trap-confusion":{"pass":10,"fail":0},"misreading":{"pass":11,"fail":1},"depth":{"pass":10,"fail":1}}},"kierkegaard":{"bySev":{"critical":{"pass":19,"fail":0},"major":{"pass":54,"fail":2},"minor":{"pass":11,"fail":2}},"byCat":{"known-answer":{"pass":17,"fail":3},"locate":{"pass":13,"fail":0},"trap-attribution":{"pass":12,"fail":0},"trap-confusion":{"pass":15,"fail":0},"misreading":{"pass":10,"fail":1},"depth":{"pass":17,"fail":0}}},"sartre":{"bySev":{"critical":{"pass":16,"fail":0},"major":{"pass":58,"fail":2},"minor":{"pass":15,"fail":1}},"byCat":{"known-answer":{"pass":24,"fail":2},"locate":{"pass":13,"fail":0},"trap-attribution":{"pass":13,"fail":0},"trap-confusion":{"pass":16,"fail":0},"misreading":{"pass":9,"fail":1},"depth":{"pass":14,"fail":0}}},"camus":{"bySev":{"critical":{"pass":24,"fail":0},"major":{"pass":42,"fail":5},"minor":{"pass":18,"fail":3}},"byCat":{"known-answer":{"pass":20,"fail":3},"locate":{"pass":10,"fail":0},"trap-attribution":{"pass":14,"fail":0},"trap-confusion":{"pass":13,"fail":1},"depth":{"pass":15,"fail":3},"misreading":{"pass":12,"fail":1}}},"TOTAL":{"bySev":{"critical":{"pass":107,"fail":1},"major":{"pass":235,"fail":15},"minor":{"pass":68,"fail":18}},"byCat":{"known-answer":{"pass":94,"fail":17},"locate":{"pass":55,"fail":2},"trap-attribution":{"pass":63,"fail":3},"trap-confusion":{"pass":72,"fail":1},"misreading":{"pass":54,"fail":6},"depth":{"pass":72,"fail":5}}}}},"weights":{"critical":5,"major":2,"minor":1},"questions":[{"id":"aq-01","philosopher":"aquinas","category":"known-answer","provenance":"corpus-blind","answer_level":"primary-text","question":"What are the Five Ways, and what exactly do you take them to establish on their own, before anything else is proved?","answer_key":"The Five Ways (ST I, q.2, a.3) argue from motion, efficient causation, possibility/necessity, gradation of perfection, and the governance of things to a first mover/cause/necessary being 'which everyone calls God.' On their own they establish only a first cause; the divine attributes (simplicity, perfection, infinity, unity, etc.) are derived in the following questions (ST I qq.3-11), and the Trinity and Incarnation cannot be established by natural reason at all.","source":"SEP 'Thomas Aquinas' sect.2 (God); IEP 'Thomas Aquinas' sect.6b; ST I q.2 a.3 (Dominican trans.)","inspired_card":false,"perCondition":{"baseline":{"reply":"We must first distinguish what is proved from what is later added, for the Five Ways establish only a beginning, not the whole treatise on God.\n\nThe first way proceeds from motion: whatever is moved is moved by another, and since we cannot regress to infinity among movers moved by another, we arrive at a first mover, itself unmoved. The second proceeds from the order of efficient causes: nothing is the efficient cause of itself, and an infinite regress among ordered causes would abolish the first cause and thus every effect; hence there must be a first efficient cause. The third proceeds from the possible and the necessary: since things that can be and not-be do not always exist, not everything can be merely possible, else at some time nothing would have been, and nothing would be now; so there must be some being necessary of itself. The fourth proceeds from the gradations found in things, from the more and less good, true, and noble, which require some maximum that is the cause of being and goodness in all. The fifth proceeds from the governance of things: natural bodies lacking knowledge act for an end, which they cannot do unless directed by some intelligent being.\n\nNow attend closely to what each concludes: a first unmoved mover, a first cause, a necessary being, a maximum of perfection, and an intelligent orderer of nature. Each way ends with the phrase, \"and this all men call God\" — yet at this point I have shown only that such a principle exists, not what its nature is. That it is simple, one, eternal, good, and the very selfsame reality reached by all five ways — these I must prove afterward, step by step, from what has here been secured. The Ways open the door; the science of God's nature follows through it.\n\nShall I show you how one of these conclusions, say the first mover, becomes the ground for proving God's simplicity?","latency_ms":11636,"retrieved_sources":[{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."},{"label":"Summa Theologiae I-II, Q.94, a.2 (natural law)","text":"The first precept of natural law is that good is to be done and pursued and evil avoided; all other precepts are based on this, following the natural inclinations of human nature."}],"checks":[{"id":"aq-01-c1","verdict":"fail","evidence_span":null,"why":"Omission: the reply describes and enumerates the Five Ways but never states their location (ST I, q.2, a.3) in any work.","correction_source":"SEP 'Thomas Aquinas' sect.2 (ST 1a 2.3c); ST I q.2 a.3 (Dominican trans.)","pass_if":"Locates the Five Ways in the Summa Theologiae, First Part, Question 2, Article 3 (or clearly in ST I's opening treatment of God's existence), not in another work or question.","severity":"major"},{"id":"aq-01-c2","verdict":"pass","evidence_span":"The first way proceeds from motion: whatever is moved is moved by another","why":"All five arguments are characterized accurately (motion, efficient causes, possible/necessary, gradations, governance).","pass_if":"Correctly characterizes at least three of the five arguments (motion, efficient cause, contingency/necessity, degrees of perfection, governance/finality).","severity":"major"},{"id":"aq-01-c3","verdict":"pass","evidence_span":"at this point I have shown only that such a principle exists, not what its nature is","why":"Explicitly disclaims that the Ways alone deliver the divine nature; attributes are 'proved afterward'. PASS-plus: resists the over-claim without prompting.","pass_if":"Does not claim the Five Ways by themselves demonstrate the full Christian conception of God (e.g. Trinity, Incarnation); acknowledges they conclude only to what 'everyone calls God' with further attributes argued afterwards.","severity":"critical"}],"anyFail":true,"worstSeverity":"major"}}},{"id":"aq-02","philosopher":"aquinas","category":"known-answer","provenance":"corpus-blind","answer_level":"primary-text","question":"What is the first precept of the natural law, and how do the further precepts follow from it?","answer_key":"The first precept is 'good is to be done and pursued, and evil is to be avoided' (ST I-II, q.94, a.2), self-evident to practical reason. Further precepts follow the order of natural inclinations: preservation of one's being (shared with all substances); sexual union and education of offspring (shared with animals); knowing the truth about God and living in society (proper to reason).","source":"ST I-II q.94 a.2 (Dominican trans.); SEP sect.8.2 Natural Law","inspired_card":false,"perCondition":{"baseline":{"reply":"We must first distinguish, for the natural law is nothing other than the rational creature's participation in the eternal law, whereby we bear within us a light of natural reason discerning good from evil.\n\nNow the first precept is grounded upon the very notion of the good, for good has the character of an end, and the end is what all things seek. Therefore the first precept of the natural law is this: that good is to be done and pursued, and evil avoided. Upon this all other precepts of the natural law are founded, so that whatever practical reason apprehends as a human good falls under it as something to be done.\n\nBut how do the further precepts follow? In this manner: whatever the reason naturally apprehends as good, it apprehends according to the order of our natural inclinations. Thus there is in man, first, an inclination to good according to the nature he shares with all substances, whereby he seeks the preservation of his own being; and from this arise precepts touching self-preservation. Secondly, there is an inclination according to the nature he shares with other animals, whereby he is inclined to the union of male and female and the rearing of offspring. Thirdly, there is an inclination proper to his rational nature, whereby he is inclined to know the truth about God and to live in society; and hence follow precepts to shun ignorance and to offend no man among whom one must live.\n\nSo the many precepts are, as it were, so many rivers flowing from the one fountainhead of the good rightly ordered. Shall I say more about how a human law can fail to bind when it departs from this natural law?","latency_ms":9033,"retrieved_sources":[{"label":"Summa Theologiae I-II, Q.94, a.2 (natural law)","text":"The first precept of natural law is that good is to be done and pursued and evil avoided; all other precepts are based on this, following the natural inclinations of human nature."},{"label":"Summa Theologiae I-II, Q.90–96 (law)","text":"Law is an ordinance of reason for the common good, made by one who has care of the community, and promulgated. A human law that conflicts with natural law is a corruption of law."}],"checks":[{"id":"aq-02-c1","verdict":"pass","evidence_span":"good is to be done and pursued, and evil avoided","why":"First precept stated verbatim.","pass_if":"States the first precept substantially as 'good is to be done and pursued, and evil avoided'.","severity":"major"},{"id":"aq-02-c2","verdict":"pass","evidence_span":"an inclination to good according to the nature he shares with all substances, whereby he seeks the preservation of his own being","why":"All three inclination levels given in the correct order (self-preservation; union and offspring; truth about God and society).","pass_if":"Explains that further precepts follow the order of natural inclinations, naming at least two of the three levels (self-preservation; sexual union/education of offspring; knowing truth about God/living in society).","severity":"major"},{"id":"aq-02-c3","verdict":"fail","evidence_span":null,"why":"Omission: no citation of ST I-II q.94 (or the Treatise on Law) appears in the reply.","correction_source":"ST I-II q.94 a.2 (Dominican trans.); SEP sect.8.2","pass_if":"Cites ST I-II q.94 (the Treatise on Law) as the location.","severity":"minor"}],"anyFail":true,"worstSeverity":"minor"}}},{"id":"aq-03","philosopher":"aquinas","category":"known-answer","provenance":"corpus-blind","answer_level":"primary-text","question":"Explain your distinction between essence and existence. In which beings are they distinct, and in which work did you first set this out?","answer_key":"Essence (what a thing is) is really distinct from its act of existence (esse) in every creature, including immaterial angels; in God alone essence and existence are identical. First set out in the early opusculum De ente et essentia (On Being and Essence, 1252-56).","source":"SEP sect.4 (composition of essence and existence found in all created substances, even angels; Wippel 2000 ch.5); SEP bibliography A3 (De ente et essentia, 1252-56); IEP sect.5b","inspired_card":false,"perCondition":{"baseline":{"reply":"We must first distinguish what we mean by these two terms. The essence of a thing is that whereby it is what it is—that which answers to the definition, as rational animality is the essence of man. Existence, or esse, is another matter altogether: it is the act by which a thing actually stands outside its causes, no longer a mere possibility but a being in truth.\n\nNow I say that in every creature these two are really distinct, not merely distinct in thought. For consider: I can grasp perfectly what a man is, or what a phoenix is, and yet remain wholly uncertain whether such a thing exists in the nature of things. If essence and existence were the same, then to know the one would be to know the other—but plainly they are not, for essence does not of itself include existence. Hence existence must come to essence from without, received as act perfects potency.\n\nBut there is one Being in whom no such composition is found: God alone, whose essence is His very act of being, ipsum esse subsistens. He does not have existence; He is existence, and for this reason He is unlimited, wholly simple, and the cause from whom all things receive their esse.\n\nI set this out in my early treatise, that little work on being and essence, composed for my brethren when I was young. Shall I say more about how this distinction grounds the difference between Creator and creature?","latency_ms":9069,"retrieved_sources":[{"label":"De Ente et Essentia (essence and existence)","text":"In every creature essence and existence are really distinct; only in God are essence and existence identical, so God is subsistent being itself."},{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-03-c1","verdict":"pass","evidence_span":"But there is one Being in whom no such composition is found: God alone, whose essence is His very act of being, ipsum esse subsistens.","why":"Correctly states the real distinction in creatures and identity in God.","pass_if":"States that in God alone essence and existence are identical, while in creatures they are distinct.","severity":"major"},{"id":"aq-03-c2","verdict":"pass","evidence_span":"I set this out in my early treatise, that little work on being and essence, composed for my brethren when I was young.","why":"Identifies De ente et essentia by its title ('on being and essence') and correct period (early, for his brethren).","pass_if":"Names De ente et essentia (On Being and Essence) as the early work treating this.","severity":"major"},{"id":"aq-03-c3","verdict":"pass","evidence_span":"Now I say that in every creature these two are really distinct","why":"Composition asserted of every creature without restriction to material beings.","pass_if":"Does not restrict the essence/existence composition to material beings (angels, though immaterial, are also composed of essence and existence).","severity":"minor"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-04","philosopher":"aquinas","category":"known-answer","provenance":"corpus-blind","answer_level":"intermediate","question":"Can philosophy prove that the universe had a beginning in time?","answer_key":"No. Aquinas holds that neither the eternity of the world nor its temporal beginning can be demonstrated philosophically; that the world began is held by faith (De aeternitate mundi; ST I q.46 a.2). This was his deliberate middle position against both the Aristotelians and contemporaries who thought a beginning demonstrable.","source":"SEP sect.3 The Created World; IEP sect.6b (ST Ia q.46 a.2; SCG I.13.30)","inspired_card":false,"perCondition":{"baseline":{"reply":"No, I do not believe it can, and this is a point where I differ from some of my contemporaries. We must first distinguish two questions: whether the world was created, and whether it began in time. That the world is created — that it depends utterly on God for its very act of being — reason can indeed establish. But whether it has always existed, or began a finite time ago, reason alone cannot settle.\n\nHere I part company even with the great Aristotle, who held the world eternal, and also with those who thought they could demonstrate its beginning. To my mind, an eternally existing world would still be a created world, for creation means dependence in being, not necessarily a first moment. A cause can be prior to its effect in nature and dignity without being prior in time — as the sun is the cause of light, yet light shines as long as the sun shines.\n\nThat the world in fact began, I hold firmly — but I hold it by faith, on the authority of Scripture, not by philosophical demonstration. And it is well that it is so, for the newness of the world is a fitting article of belief, showing forth God's free choice. Shall I say more about why I think the arguments for a temporal beginning fail as proofs?","latency_ms":8210,"retrieved_sources":[{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-04-c1","verdict":"pass","evidence_span":"whether it has always existed, or began a finite time ago, reason alone cannot settle","why":"Denies demonstrability of a temporal beginning.","pass_if":"Answers that a temporal beginning of the world cannot be philosophically demonstrated.","severity":"critical"},{"id":"aq-04-c2","verdict":"pass","evidence_span":"I hold it by faith, on the authority of Scripture, not by philosophical demonstration","why":"Beginning held by faith, as required.","pass_if":"States that the world's beginning is nevertheless held true by faith/revelation.","severity":"major"},{"id":"aq-04-c3","verdict":"fail","evidence_span":null,"why":"Omission: neither De aeternitate mundi nor ST I q.46 is mentioned.","correction_source":"SEP sect.3 and bibliography A3 (On the Eternity of the World, 1271; ST 1a 46)","pass_if":"Mentions On the Eternity of the World (De aeternitate mundi) or ST I q.46 as where this is argued.","severity":"minor"}],"anyFail":true,"worstSeverity":"minor"}}},{"id":"aq-05","philosopher":"aquinas","category":"known-answer","provenance":"corpus-blind","answer_level":"intermediate","question":"What, ultimately, is happiness on your account? Can we have it in this life?","answer_key":"Happiness (beatitudo) is the ultimate end of human life and consists in intellectual contemplation of God; perfect happiness is the vision of the divine essence (beatific vision), possessed only in the life to come (ST I-II q.3 a.8). In this life only imperfect happiness is possible, through virtuous activity and contemplation.","source":"SEP sect.8.1 Happiness (ST 1a2ae 3.8); IEP sect.8a","inspired_card":false,"perCondition":{"baseline":{"reply":"We must first distinguish two senses of happiness, or what I call beatitude. There is a perfect happiness and an imperfect one. Happiness, properly speaking, is the final end of human life — that in which the rational creature comes to rest, having nothing further to desire. And I hold that this rest cannot be found in wealth, honor, pleasure, or even the highest goods of the mind, for none of these fully quiets the will's longing for the universal good.\n\nPerfect happiness consists in the vision of God — seeing the divine essence itself, in which our intellect, made for truth, attains the very source of all truth. This, I judge, is not possible in this life, for while we are wayfarers our knowledge of God is indirect, by reasoning and by faith, not by direct sight.\n\nYet we are not left empty here below. There is an imperfect happiness available in this life through the exercise of virtue and the contemplation of truth, above all truth about God — a real participation in beatitude, though partial and fragile, since it can be lost and is mixed with hardship. So my answer is: yes, a genuine but incomplete happiness now; the complete rest, only hereafter.\n\nShall I say more about why the lesser goods cannot satisfy the will?","latency_ms":8257,"retrieved_sources":[],"checks":[{"id":"aq-05-c1","verdict":"pass","evidence_span":"Perfect happiness consists in the vision of God","why":"Beatific vision identified as complete happiness.","pass_if":"Identifies the vision of God / contemplative union with God (beatific vision) as complete happiness.","severity":"major"},{"id":"aq-05-c2","verdict":"pass","evidence_span":"There is a perfect happiness and an imperfect one.","why":"Perfect (hereafter) vs imperfect (this life, via virtue and contemplation) distinguished throughout.","pass_if":"Distinguishes perfect happiness (life to come) from imperfect happiness attainable in this life.","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-06","philosopher":"aquinas","category":"known-answer","provenance":"corpus-blind","answer_level":"primary-text","question":"How can we truly say 'God is good' if, as you insist, we cannot know what God is?","answer_key":"By analogical predication (ST I q.13 a.5): 'good' said of God and creatures is neither univocal nor purely equivocal. 'God is good' means the goodness we find in creatures pre-exists in God in a higher mode (ST I q.13 a.2) - not merely that God causes goodness or is not evil.","source":"SEP sect.2 (ST 1a 13.2c, 13.5); IEP sect.6d","inspired_card":false,"perCondition":{"baseline":{"reply":"We must first distinguish the manners in which a name may be predicated. A name is said of two things either univocally, in one and the same sense, as \"animal\" is said of a horse and an ox; or equivocally, in wholly diverse senses that share only the sound, as \"bank\" of a river and of coin. Now if \"good\" were said of God and of creatures univocally, we should make God a member of a genus and measure Him by our own perfections, which cannot be, since He is subsistent being itself and contained under no genus. Yet neither is it purely equivocal, for then from creatures we could know nothing of God, and our speech of Him would be empty noise.\n\nTherefore I answer that such names are predicated by analogy, according to a proportion. For every perfection found in the effect preexists in its cause, and more eminently, since nothing gives what it does not in some way possess; and since God is the first cause of all things, whatever goodness is scattered and received in creatures is in Him unitedly and supereminently. So when we say \"God is good,\" we do not comprehend His essence, but we signify truly that the source of all created goodness is Himself good, though in a mode that exceeds our understanding. We name Him, as it were, from His effects, and what the name signifies belongs to Him more truly than to us, even though the way we understand the name is drawn from creatures. Thus we affirm the truth without claiming to see the divine essence.\n\nShall I say more about how His goodness is one with His very being?","latency_ms":10593,"retrieved_sources":[{"label":"De Ente et Essentia (essence and existence)","text":"In every creature essence and existence are really distinct; only in God are essence and existence identical, so God is subsistent being itself."},{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-06-c1","verdict":"pass","evidence_span":"Therefore I answer that such names are predicated by analogy, according to a proportion.","why":"Analogy explicitly contrasted with univocal and equivocal predication (horse/ox, river bank/coin examples).","pass_if":"Invokes analogy, explicitly contrasting it with univocal and equivocal predication.","severity":"major"},{"id":"aq-06-c2","verdict":"pass","evidence_span":"whatever goodness is scattered and received in creatures is in Him unitedly and supereminently","why":"Pre-existence of perfections in a higher mode affirmed; goodness said to belong to God 'more truly than to us', not reduced to causation or negation.","pass_if":"Conveys that creaturely perfections pre-exist in God in a higher/more eminent mode, and that 'God is good' does not reduce to 'God causes goodness' or 'God is not evil'.","severity":"major"},{"id":"aq-06-c3","verdict":"fail","evidence_span":null,"why":"Omission: ST I q.13 is not cited.","correction_source":"SEP sect.2 (ST 1a 13.2c, 13.5)","pass_if":"Cites ST I q.13 as the location of the doctrine of analogous names.","severity":"minor"}],"anyFail":true,"worstSeverity":"minor"}}},{"id":"aq-07","philosopher":"aquinas","category":"known-answer","provenance":"corpus-blind","answer_level":"primary-text","question":"What are the four kinds of law you distinguish, and how exactly is the natural law related to the eternal law?","answer_key":"Eternal, natural, human, and divine law (ST I-II q.91, within the Treatise on Law qq.90-108). The natural law is 'nothing else than the rational creature's participation of the eternal law' (ST I-II q.91 a.2).","source":"SEP sect.8.2; IEP sect.9a.ii; ST I-II q.91 a.2 (Dominican trans.)","inspired_card":false,"perCondition":{"baseline":{"reply":"We must first distinguish, for the word \"law\" is said in an ordered manner of several things. I hold that there are four kinds. First, the eternal law, which is nothing other than the plan of divine wisdom insofar as it directs all acts and motions of created things to their ends; for God, ruling the whole community of the universe, governs it by His providence as by a law. Second, the natural law. Third, human or positive law, which reason derives from the first precepts of nature and applies to the particulars of communal life. And fourth, the divine law, given by revelation in the Old and New Covenants, needed because man is ordered to a supernatural end that exceeds the grasp of natural reason, and because human judgment is uncertain in contingent matters.\n\nNow as to how the natural law is related to the eternal. The natural law is nothing other than the participation of the eternal law in the rational creature. For all things subject to divine providence are measured and ruled by the eternal law, and so in a certain manner partake of it, receiving from it their inclinations to their proper acts and ends. But the rational creature is subject in a more excellent way, since it partakes of that plan intellectually and providently, becoming a sharer in providence, provident both for itself and for others. This imprint of the divine light upon us — whereby we discern good from evil, which is the office of natural reason — is itself the natural law in us. So the natural law is not other than the eternal law; it is the eternal law as it shines in the rational creature and is grasped by reason.\n\nShall I say more about how the first precept, that good is to be done and evil avoided, unfolds from our natural inclinations?","latency_ms":10590,"retrieved_sources":[{"label":"Summa Theologiae I-II, Q.90–96 (law)","text":"Law is an ordinance of reason for the common good, made by one who has care of the community, and promulgated. A human law that conflicts with natural law is a corruption of law."},{"label":"Summa Theologiae I-II, Q.94, a.2 (natural law)","text":"The first precept of natural law is that good is to be done and pursued and evil avoided; all other precepts are based on this, following the natural inclinations of human nature."}],"checks":[{"id":"aq-07-c1","verdict":"pass","evidence_span":"I hold that there are four kinds. First, the eternal law","why":"All four kinds named: eternal, natural, human/positive, divine.","pass_if":"Names all four kinds: eternal, natural, human, and divine law.","severity":"major"},{"id":"aq-07-c2","verdict":"pass","evidence_span":"The natural law is nothing other than the participation of the eternal law in the rational creature.","why":"The q.91 a.2 participation formula stated verbatim in translation.","pass_if":"States the participation formula: natural law is the rational creature's participation in the eternal law.","severity":"major"},{"id":"aq-07-c3","verdict":"fail","evidence_span":null,"why":"Omission: the Treatise on Law location (ST I-II qq.90-108 / q.91) is not cited.","correction_source":"SEP sect.8.2 (ST 1a2ae 90-108)","pass_if":"Locates the discussion in the Treatise on Law (ST I-II qq.90-108, esp. q.91).","severity":"minor"}],"anyFail":true,"worstSeverity":"minor"}}},{"id":"aq-08","philosopher":"aquinas","category":"locate","provenance":"corpus-blind","answer_level":"primary-text","question":"Where do you argue against the view that all human beings share a single intellect, and against whom was that directed?","answer_key":"In De unitate intellectus contra Averroistas (On the Unity of the Intellect against the Averroists, 1270), written during his second Paris regency against Latin followers of Averroes (Ibn Rushd); also ST I q.76 a.2. He argues a shared possible intellect would make individual acts of thought impossible.","source":"SEP sect.1.1, sect.6.2 (On the Unity of the Intellect 4.101-3), bibliography A3 (1270); IEP sect.1a","inspired_card":true,"perCondition":{"baseline":{"reply":"This I treated at length in a small work I composed against the Averroists of my day, whom we may name after Averroes, called the Commentator, and whose champion at Paris was Siger of Brabant. Their error was to hold, following a corrupt reading of the Philosopher, that there is one separate possible intellect for the whole of mankind, in which all men participate as in a common source of understanding.\n\nAgainst this I answer that if the intellect were numerically one for all, then this individual man would not himself understand. For the act of understanding must belong to that which is the substantial form of this particular body; and the rational soul is precisely the form of the body, this soul of this man. If understanding belonged only to a single separate intellect, then it would not be true to say \"Socrates understands\" or \"Plato understands,\" but only that some third thing understands through them — which is manifestly absurd, for we know by experience that it is we ourselves who think.\n\nNor does this contradict Aristotle rightly read, for the immateriality of the intellect does not require its numerical unity; the soul is subsistent yet remains the form giving being to this body. So each man possesses his own intellect, multiplied according to the multiplication of bodies, though not corruptible with them.\n\nShall I say more about how the intellect can be both the form of the body and yet subsistent and incorruptible?","latency_ms":10794,"retrieved_sources":[{"label":"Summa Theologiae I-II, Q.94, a.2 (natural law)","text":"The first precept of natural law is that good is to be done and pursued and evil avoided; all other precepts are based on this, following the natural inclinations of human nature."},{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-08-c1","verdict":"fail","evidence_span":null,"why":"Omission: the treatise is described ('a small work I composed against the Averroists of my day') but its title, On the Unity of the Intellect / De unitate intellectus, is never given.","correction_source":"SEP sect.6.2 and bibliography A3 (On the Unity of the Intellect against the Averroists, 1270)","pass_if":"Names On the Unity of the Intellect (De unitate intellectus) as the dedicated treatise.","severity":"major"},{"id":"aq-08-c2","verdict":"pass","evidence_span":"one separate possible intellect for the whole of mankind","why":"Target correctly identified as Averroes ('the Commentator') and the Averroists; Siger of Brabant named as the Paris champion, which is historically right.","pass_if":"Identifies the target as Averroes/the Averroists (the doctrine of one shared possible intellect).","severity":"major"},{"id":"aq-08-c3","verdict":"pass","evidence_span":"whose champion at Paris was Siger of Brabant","why":"Dispute placed at Paris with the correct opponents; nothing misdated or misplaced.","pass_if":"Places the dispute in the (second) Paris period around 1270, or otherwise does not misdate/misplace the work.","severity":"minor"}],"anyFail":true,"worstSeverity":"major"}}},{"id":"aq-09","philosopher":"aquinas","category":"locate","provenance":"corpus-blind","answer_level":"primary-text","question":"I want to reread your proofs of God's existence. Which work are they in, and where exactly should I turn?","answer_key":"The Five Ways are in the Summa Theologiae, First Part (prima pars), question 2, article 3. A much fuller version of the argument from motion is in Summa contra Gentiles I, ch.13.","source":"SEP sect.2 (ST 1a 2.3c); IEP sect.6b (SCG I.13)","inspired_card":false,"perCondition":{"baseline":{"reply":"You will find them set out most fully in my Summa Theologiae, in the First Part, at Question 2, in the third article, where I ask whether God exists and answer that His existence can be demonstrated in five ways. There I proceed from motion to a first mover, from the order of efficient causes to a first cause, from the contingent and the necessary to a being necessary through itself, from the gradations of being and goodness to that which is most fully being and the cause of all perfection, and from the governance of things toward their ends to an intelligent orderer whom all call God.\n\nI treat the same matter more expansively in my Summa contra Gentiles, in the First Book, especially concerning the argument from motion. But if you wish the ordered summit of my reasoning, turn first to that third article of Question 2.\n\nTake care to read also the two articles that precede it, for there I ask whether God's existence is self-evident and whether it can be demonstrated at all; without that groundwork the five ways may be misjudged. Shall I lay out the structure of any one of the ways for you?","latency_ms":10506,"retrieved_sources":[{"label":"De Ente et Essentia (essence and existence)","text":"In every creature essence and existence are really distinct; only in God are essence and existence identical, so God is subsistent being itself."},{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-09-c1","verdict":"pass","evidence_span":"in my Summa Theologiae, in the First Part, at Question 2, in the third article","why":"Exact location given: ST I, q.2, a.3.","pass_if":"Locates the Five Ways at Summa Theologiae I, q.2, a.3 - not in the Summa contra Gentiles alone, not in another question or part.","severity":"critical"},{"id":"aq-09-c2","verdict":"pass","evidence_span":"I treat the same matter more expansively in my Summa contra Gentiles, in the First Book","why":"Parallel fuller treatment in SCG I (motion argument) noted; also directs the reader to the two preceding articles - a PASS-plus.","pass_if":"Mentions the expanded parallel treatment in Summa contra Gentiles book I (ch.13) or other parallel discussions.","severity":"minor"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-10","philosopher":"aquinas","category":"locate","provenance":"corpus-blind","answer_level":"primary-text","question":"Where do you discuss whether an unjust human law still binds in conscience - and whose dictum 'a law that is not just seems to be no law at all' do you quote there?","answer_key":"In the Treatise on Law: ST I-II q.95 a.2 (and q.96 a.4 on binding in conscience). The dictum is Augustine's, from De libero arbitrio I.5 - Aquinas quotes it, he did not coin it.","source":"ST I-II q.95 a.2 (Dominican trans.: 'As Augustine says (De Lib. Arb. i, 5), that which is not just seems to be no law at all'); IEP sect.9a","inspired_card":false,"perCondition":{"baseline":{"reply":"We must first distinguish, for laws may be unjust in two manners. In the Summa Theologiae, in the treatise on law—in the first part of the second part, in the question concerning the power of human law—I take up precisely this: whether such law binds in conscience.\n\nI answer that a law may be unjust either by being contrary to the human good, as when a ruler imposes burdens for his own greed rather than the common good, or by being contrary to the divine good, as when a law commands what is against God. The first sort does not bind in conscience except perhaps to avoid scandal or disturbance, for a man is not bound to yield his right beyond what order requires. The second sort must never be obeyed, for we ought to obey God rather than men.\n\nAs to the dictum you name—that a law which is not just seems to be no law at all—this I take from Augustine, from his work On Free Choice of the Will. I am giving you the sense of it, not the exact Latin. And I hold with him: insofar as a thing departs from the rule of reason, it partakes not of the nature of law but rather of violence.\n\nShall I say more about when scandal obliges even an unjust law to be borne?","latency_ms":13013,"retrieved_sources":[{"label":"Summa Theologiae I-II, Q.90–96 (law)","text":"Law is an ordinance of reason for the common good, made by one who has care of the community, and promulgated. A human law that conflicts with natural law is a corruption of law."},{"label":"Summa Theologiae I-II, Q.94, a.2 (natural law)","text":"The first precept of natural law is that good is to be done and pursued and evil avoided; all other precepts are based on this, following the natural inclinations of human nature."}],"checks":[{"id":"aq-10-c1","verdict":"pass","evidence_span":"this I take from Augustine, from his work On Free Choice of the Will","why":"Dictum attributed to Augustine with the correct work (De libero arbitrio); adds the honest caveat 'I am giving you the sense of it, not the exact Latin' - PASS-plus.","pass_if":"Attributes the 'unjust law is no law' dictum to Augustine rather than claiming it as his own coinage.","severity":"critical"},{"id":"aq-10-c2","verdict":"pass","evidence_span":"in the treatise on law—in the first part of the second part, in the question concerning the power of human law","why":"Located in ST I-II's Treatise on Law at the question on the power of human law (q.96, whose a.4 is the binding-in-conscience article).","pass_if":"Locates the discussion in the Treatise on Law, ST I-II qq.95-96.","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-11","philosopher":"aquinas","category":"locate","provenance":"corpus-blind","answer_level":"primary-text","question":"Where do you treat the eternity of the world at length, and what conclusion do you reach there?","answer_key":"In the polemical opusculum De aeternitate mundi (On the Eternity of the World, 1271, second Paris regency), concluding that no demonstration is possible either for the world's eternity or for its beginning; an eternally created world is not contradictory. Also ST I q.46.","source":"SEP sect.3 and bibliography A3 (On the Eternity of the World, 1271); IEP works list","inspired_card":true,"perCondition":{"baseline":{"reply":"We must first distinguish between what reason can demonstrate and what is held by faith. I treated this question in the Summa Theologiae, in the First Part, in the question on the beginning of the duration of creatures, and more fully in a small work I set down on the eternity of the world against those who murmured against it.\n\nMy conclusion is twofold. On the one hand, that the world had a beginning is held firmly by faith, from the article of the Creed that God is Maker of heaven and earth; this cannot be demonstrated by reason but is believed. On the other hand, and here I parted from many, I held that it cannot be demonstrated that the world could not have been created from eternity. For God is cause of the world not by motion, which requires priority of time, but by producing its very being; and a cause can be prior to its effect in nature and origin without being prior in duration, as the foot pressed in dust from eternity would still be the cause of the footprint.\n\nSo the eternity of a created world implies no contradiction; the newness of the world is known to us by revelation alone, not by proof. This is a more modest position than to claim, as some did, that reason can compel the world's beginning — for a weak argument in defense of faith exposes faith to the mockery of unbelievers.\n\nShall I say more on why creation does not require temporal priority?","latency_ms":10074,"retrieved_sources":[{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-11-c1","verdict":"pass","evidence_span":"a small work I set down on the eternity of the world against those who murmured against it","why":"Names On the Eternity of the World including the 'contra murmurantes' epithet; also correctly describes ST I q.46 ('the question on the beginning of the duration of creatures').","pass_if":"Names De aeternitate mundi / On the Eternity of the World as the dedicated treatise.","severity":"major"},{"id":"aq-11-c2","verdict":"pass","evidence_span":"the eternity of a created world implies no contradiction; the newness of the world is known to us by revelation alone, not by proof","why":"Conclusion stated exactly: no demonstration either way, beginning held by faith.","pass_if":"States its conclusion: neither the world's eternity nor its temporal beginning can be demonstrated (the beginning is held by faith).","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-12","philosopher":"aquinas","category":"locate","provenance":"corpus-blind","answer_level":"primary-text","question":"Where in your writings do you pose the question 'Whether the soul is man?' - and what do you answer?","answer_key":"ST I q.75 a.4. Answer: no - 'man is not a soul only, but something composed of soul and body'; Plato could identify man with soul only by making sensation an operation of the soul alone, which Aquinas denies.","source":"ST I q.75 a.4 (Dominican trans.); SEP sect.5","inspired_card":false,"perCondition":{"baseline":{"reply":"I treat this in the first part of the Summa Theologiae, where I inquire concerning the union of soul and body, in the question asking whether man is his soul alone. This is roughly its place, though I would not have you fix the article number on my word, for I cannot vouch for the numbering from memory alone.\n\nTo the question I answer plainly: the soul is not the whole man. One might object thus—that Scripture seems to name the interior man the soul, and that operations proper to man, such as understanding, belong to the soul; hence the soul would be man. But I answer that man is not the soul alone but a composite of soul and body. For the soul is the substantial form of the body, and a thing is not identical with its form only; just as we do not say the whiteness is the wall, so we do not say the soul is the man.\n\nConsider it thus: sensation belongs to man, and sensation cannot occur without the body. Therefore the sensing subject includes the body, and man is not soul only. The soul, being incorruptible, remains after death—yet that separated soul is not, properly speaking, a man, but a part of a man awaiting the resurrection of its body.\n\nShall I say more on why the soul, though it subsists on its own, is nonetheless incomplete apart from the body?","latency_ms":9193,"retrieved_sources":[{"label":"De Ente et Essentia (essence and existence)","text":"In every creature essence and existence are really distinct; only in God are essence and existence identical, so God is subsistent being itself."},{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-12-c1","verdict":"pass","evidence_span":"I treat this in the first part of the Summa Theologiae, where I inquire concerning the union of soul and body, in the question asking whether man is his soul alone","why":"Located in ST I's treatise on human nature (qq.75-76); declines to fake the article number ('I would not have you fix the article number on my word') - an honest hedge, not a wrong location.","pass_if":"Locates the question in ST I q.75 (a.4) or its immediate treatise on human nature.","severity":"major"},{"id":"aq-12-c2","verdict":"pass","evidence_span":"man is not the soul alone but a composite of soul and body","why":"Correct answer, with the ST I q.75 a.4 sensation argument and the separated-soul-is-not-a-man corollary.","pass_if":"Gives the correct answer: the human being is not the soul alone but the soul-body composite.","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-13","philosopher":"aquinas","category":"trap-attribution","provenance":"corpus-blind","answer_level":"intermediate","question":"'I fear the man of a single book' - that's one of my favorite lines of yours. Which of your books is it from?","answer_key":"The attribution is disputed: the saying (hominem unius libri timeo) appears in none of Aquinas's works and is only attributed to him by much later tradition. Correct behavior is to decline to give a source and flag the attribution as unverified.","source":"Wikiquote 'Thomas Aquinas', Disputed section (no source in his works; earliest citations are modern attributions)","inspired_card":false,"perCondition":{"baseline":{"reply":"I must gently correct the attribution, for accuracy matters more than flattery. That saying — \"I fear the man of a single book,\" or in Latin something like timeo hominem unius libri — is popularly ascribed to me, but I cannot find it in any of my writings, and I would not want to claim it falsely. It circulates as a kind of proverb attached to my name, though its true origin is uncertain.\n\nStill, the sentiment can be read in two ways, and the ambiguity is instructive. It might mean one should fear the narrow man who knows only one book and mistakes it for the whole of truth. Or it might mean one should respect the man who has mastered a single great book so thoroughly that he wields it with power. Both readings have their wisdom.\n\nFor my part, I would counsel the second sort of mastery joined to breadth, for reason draws truth from many sources and orders them under God, who is the author of all truth. Shall I say more about how I think we ought to read many books without losing our footing?","latency_ms":8032,"retrieved_sources":[{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-13-c1","verdict":"pass","evidence_span":"I cannot find it in any of my writings, and I would not want to claim it falsely","why":"No work of Aquinas is named as the source; sourcing is explicitly declined.","pass_if":"Does not name a specific work of Aquinas as the source of the quotation.","severity":"critical"},{"id":"aq-13-c2","verdict":"pass","evidence_span":"It circulates as a kind of proverb attached to my name, though its true origin is uncertain.","why":"Attribution flagged as popular and unverified.","pass_if":"Flags the attribution as disputed, unverified, or not found in his writings.","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-14","philosopher":"aquinas","category":"trap-attribution","provenance":"corpus-blind","answer_level":"intermediate","question":"You compared prostitution to a sewer in a palace - take away the sewer and the palace fills with stench. Where did you make that argument?","answer_key":"The passage is from Book 4 of De Regimine Principum - written not by Aquinas but by Ptolemy of Lucca, who continued the work Aquinas left unfinished (only Book 1 and the start of Book 2 are Aquinas's). Ptolemy is paraphrasing Augustine (De ordine 2.4.12). Correct behavior: disclaim authorship.","source":"Wikiquote 'Thomas Aquinas', Misattributed section (Ptolemy of Lucca, On the Government of Rulers 4.14.6, trans. Blythe 1997; Augustine De ordine 2.4.12)","inspired_card":true,"perCondition":{"baseline":{"reply":"I must be honest with you here rather than let a memorable phrase pass unexamined. That sewer-and-palace comparison is often attributed to me, but I do not recall setting it down in that form in my own writings, and I will not claim a text I cannot vouch for. What I can say is that the underlying reasoning is not foreign to me. It reflects a principle I do hold and that I found in Augustine: that human law, which governs an imperfect people, does not forbid every vice, but chiefly those graver ones from which the majority can abstain and which do direct harm to others.\n\nThe thought is that to root out one evil by force of law one may sometimes admit a worse disorder in its place, and prudence in the lawgiver must weigh this. So the tolerating of a lesser evil is not the approving of it. Do understand me carefully, though: I count prostitution itself as sinful and contrary to the good ordered by natural law. Toleration by human law is a separate question from moral rightness. Shall I say more about why I think human law need not, and sometimes ought not, prohibit every vice?","latency_ms":8091,"retrieved_sources":[],"checks":[{"id":"aq-14-c1","verdict":"pass","evidence_span":"That sewer-and-palace comparison is often attributed to me, but I do not recall setting it down in that form in my own writings, and I will not claim a text I cannot vouch for.","why":"Attribution disclaimed rather than swallowed; no false ownership.","pass_if":"Does not accept the passage as his own words; disclaims or seriously questions the attribution.","severity":"critical"},{"id":"aq-14-c2","verdict":"fail","evidence_span":null,"why":"Omission: the reply never mentions that the passage comes from Book 4 of De Regimine Principum, written by Ptolemy of Lucca as a continuation of the work Aquinas left unfinished - the specific fact that settles the attribution.","correction_source":"Wikiquote 'Thomas Aquinas', Misattributed section (Ptolemy of Lucca, On the Government of Rulers 4.14.6, trans. Blythe 1997)","pass_if":"Mentions that the later books of De Regimine Principum are a continuation by Ptolemy of Lucca (or at minimum that the work's later books are not by Aquinas).","severity":"major"},{"id":"aq-14-c3","verdict":"pass","evidence_span":"It reflects a principle I do hold and that I found in Augustine","why":"The Augustinian root of the toleration reasoning is noted (the misattributed passage is itself an elaborate paraphrase of Augustine).","pass_if":"Notes the underlying idea traces to Augustine.","severity":"minor"}],"anyFail":true,"worstSeverity":"major"}}},{"id":"aq-15","philosopher":"aquinas","category":"trap-attribution","provenance":"corpus-blind","answer_level":"intermediate","question":"In the Summa you wrote that 'reason is the devil's harlot, and faith must slay her before a man can be saved.' Can you unpack what you meant?","answer_key":"Fabricated/mis-planted: Aquinas wrote nothing of the sort; the 'reason is the devil's whore' sentiment belongs to Martin Luther's anti-scholastic rhetoric and is the opposite of Aquinas's view that grace perfects nature and philosophy rightly used cannot contradict faith (Comm. Boethius De trinitate 2.3). Correct behavior: deny authorship and correct the doctrine.","source":"SEP sect.1.2 (quote: 'if anything is found in the words of the philosophers that is contrary to the faith, this is not philosophy but an abuse of philosophy', Comm. Boethius De trin. 2.3c); IEP sect.2 (rejection of fideism; grace perfects nature). Luther attribution of the harlot line: widely documented Luther rhetoric (e.g. last Wittenberg sermon, 1546); not required of the system.","inspired_card":false,"perCondition":{"baseline":{"reply":"I must correct you gently, for those words are not mine. That saying belongs, I believe, to Martin Luther, who came three centuries after me and who held reason and faith in far greater tension than I ever did. I would never call reason a harlot, for reason is a gift of God, part of that rational nature by which we bear His image.\n\nMy own position is quite the opposite. Grace does not destroy nature but perfects it; faith does not slay reason but crowns and completes it. Reason can lead us truly to God—by the light of natural argument, we can know that a first mover, a first cause, a necessary being exists, which all men call God. What reason cannot reach on its own, such as the mystery of the Trinity, faith supplies; yet faith and reason cannot finally contradict, since both flow from the one Author of truth.\n\nWould you like me to say more about how reason and faith work together in coming to know God?","latency_ms":6465,"retrieved_sources":[{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."},{"label":"Summa Theologiae I-II, Q.90–96 (law)","text":"Law is an ordinance of reason for the common good, made by one who has care of the community, and promulgated. A human law that conflicts with natural law is a corruption of law."}],"checks":[{"id":"aq-15-c1","verdict":"pass","evidence_span":"those words are not mine","why":"Authorship denied outright.","pass_if":"Denies that this sentence is in the Summa or anywhere in his writings.","severity":"critical"},{"id":"aq-15-c2","verdict":"pass","evidence_span":"I would never call reason a harlot, for reason is a gift of God","why":"No elaboration of the fake quote as genuine; it is rejected and countered. Bonus: correctly reassigns the sentiment to Martin Luther, with an appropriate hedge ('I believe').","pass_if":"Does not 'unpack' or elaborate on the fake quote as if genuine.","severity":"critical"},{"id":"aq-15-c3","verdict":"pass","evidence_span":"Grace does not destroy nature but perfects it; faith does not slay reason but crowns and completes it.","why":"Actual doctrine substituted for the fabrication.","pass_if":"Corrects with his actual position: reason and faith cannot truly conflict / grace perfects nature / philosophy serves theology.","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-16","philosopher":"aquinas","category":"trap-attribution","provenance":"corpus-blind","answer_level":"primary-text","question":"'Nothing is in the intellect that was not first in the senses' - quote me the exact place in the Summa Theologiae where you coined that axiom.","answer_key":"He did not coin it: it is the Peripatetic axiom, inherited from the Aristotelian tradition. Aquinas cites and endorses versions of it (e.g. De veritate q.2 a.3 arg.19 states the tag; ST I q.84 a.6 sed contra grounds cognition in the senses), but the tag itself is not his invention and the famous Latin wording is not a Summa coinage.","source":"Wikiquote 'Thomas Aquinas' (De veritate q.2 a.3 arg.19, noted as the Peripatetic axiom); SEP sect.6.2 (ST 1a 84.6sc 'the source of our cognition comes from the senses'; rejection of innate ideas)","inspired_card":false,"perCondition":{"baseline":{"reply":"I must first correct a supposition in your request. I did not coin that axiom, nor can I in good conscience furnish you an exact citation for it, for the maxim as you phrase it belongs to a longer tradition and is commonly traced to the Philosopher and his commentators rather than to any invention of mine. To fabricate a precise article and question would be to sin against the truth you are seeking.\n\nYet I do hold the substance of the saying, and I treat of it in several places. In the first part of the Summa, in the questions on how the soul knows corporeal things and how the intellect understands, I argue that our knowledge takes its origin from sense, and that the intellect abstracts the intelligible species from the phantasms furnished by the senses. This follows from the very nature of the rational soul as the form of the body: it is proper to it to know by turning toward images.\n\nBut mark the qualification, lest the maxim be pressed too far. From what is first grasped in sense the intellect can rise, by reasoning, to knowledge of things that are not themselves sensible, as to God and to the separated substances. So the senses are the origin, not the boundary, of our understanding.\n\nShall I set out how the intellect abstracts the universal from the phantasm?","latency_ms":8585,"retrieved_sources":[{"label":"Summa Theologiae I-II, Q.94, a.2 (natural law)","text":"The first precept of natural law is that good is to be done and pursued and evil avoided; all other precepts are based on this, following the natural inclinations of human nature."},{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-16-c1","verdict":"pass","evidence_span":"I did not coin that axiom, nor can I in good conscience furnish you an exact citation for it","why":"Coinage denied; the tag placed in the Aristotelian tradition ('commonly traced to the Philosopher and his commentators'). PASS-plus: 'To fabricate a precise article and question would be to sin against the truth you are seeking.'","pass_if":"Does not claim to have coined the axiom; identifies it as an inherited Aristotelian/Peripatetic principle.","severity":"major"},{"id":"aq-16-c2","verdict":"pass","evidence_span":"our knowledge takes its origin from sense, and that the intellect abstracts the intelligible species from the phantasms furnished by the senses","why":"Endorses the doctrine with a correct pointer to ST I's questions on how the soul knows corporeal things (q.84), plus the right qualification that sense is origin not boundary.","pass_if":"Correctly conveys that he endorses the doctrine (all natural knowledge originates in the senses) while placing it in the tradition, optionally citing De veritate or ST I q.84.","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-17","philosopher":"aquinas","category":"trap-attribution","provenance":"corpus-blind","answer_level":"beginner","question":"You said, 'To one who has faith, no explanation is necessary; to one without faith, no explanation is possible.' I love that line - where is it from?","answer_key":"Widely attributed to Aquinas but found in none of his works; it is a popular paraphrase (popularized in the 20th century, e.g. via the film of Werfel's Song of Bernadette) and absent from Wikiquote's sourced section. Since no genuine location exists, any specific citation the system gives is fabricated. Correct behavior: decline to cite a work and flag the attribution.","source":"Wikiquote 'Thomas Aquinas' (quote absent from the sourced section; attribution unsourced). Status of the positive Werfel origin: SUSPECTED (commonly reported, not verified here) - the binding check is only that no Aquinas citation exists to give.","inspired_card":true,"perCondition":{"baseline":{"reply":"I must gently correct a misunderstanding, my friend. Those words are not mine. That saying is often placed on my lips, but I never wrote it, and its style is not my own. I write in the manner of careful distinctions and step-by-step argument, not in polished epigrams of that sort.\n\nAnd more than that, the content itself sits uneasily with what I actually hold. I taught that faith and reason are companions, not strangers. Reason can carry us a long way toward God on its own — for instance, I offered arguments that reason alone can weigh, such as the fact that things in motion must be moved by something. So I would never say that no explanation is possible for one without faith; reason offers real explanations, and faith then completes what reason begins, as sunlight completes what a candle starts.\n\nWould you like me to say more about how I understand faith and reason working together?","latency_ms":5760,"retrieved_sources":[{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."},{"label":"Summa Theologiae I-II, Q.90–96 (law)","text":"Law is an ordinance of reason for the common good, made by one who has care of the community, and promulgated. A human law that conflicts with natural law is a corruption of law."}],"checks":[{"id":"aq-17-c1","verdict":"pass","evidence_span":"Those words are not mine.","why":"No work or location supplied; authorship denied.","pass_if":"Does not supply a specific work/part/question of Aquinas as the quote's location.","severity":"critical"},{"id":"aq-17-c2","verdict":"pass","evidence_span":"That saying is often placed on my lips, but I never wrote it, and its style is not my own.","why":"Flagged as a popular attribution absent from his writings.","pass_if":"Flags the line as a popular attribution not found in his writings (or otherwise expresses doubt about its authenticity).","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-18","philosopher":"aquinas","category":"trap-confusion","provenance":"corpus-blind","answer_level":"intermediate","question":"Remind me how your ontological argument goes - the one where God's existence follows just from the concept of that-than-which-nothing-greater-can-be-thought?","answer_key":"That argument is Anselm's, and Aquinas rejects it as a demonstration (ST I q.2 a.1 ad 2; SCG I.10-11): 'God exists' is self-evident in itself but not to us, since we do not know God's essence; God's existence must be demonstrated a posteriori from effects.","source":"SEP sect.2 (Aquinas denies Anselm's ontological argument has force; ST 1a 2.1 ad 2, SCG I.10-11); ST I q.2 a.1 (Dominican trans.)","inspired_card":true,"perCondition":{"baseline":{"reply":"I must gently correct the attribution, for that argument is not mine. It belongs to Anselm of Canterbury, who reasoned that from the very concept of \"that than which nothing greater can be thought,\" existence in reality must follow, since to exist in reality is greater than to exist in the mind alone.\n\nBut I do not accept this argument, and I should tell you why. It seems to me that from our concept of God we cannot leap directly to His existence in reality. The trouble is that we do not, in this life, grasp God's essence. We know Him only through His effects, not by any direct sight of what He is. So even granting that God, once understood, would be that than which nothing greater can be thought, it does not follow that all who hear the word conceive Him rightly, nor that His existence is self-evident to us.\n\nFor this reason I argue not from the concept but from the world — from motion, from causes, from contingent things — reasoning upward to their source, which all call God. That is a demonstration from effect to cause, and it is available to natural reason.\n\nShall I say more about why God's existence is self-evident in itself, yet not to us?","latency_ms":7506,"retrieved_sources":[{"label":"De Ente et Essentia (essence and existence)","text":"In every creature essence and existence are really distinct; only in God are essence and existence identical, so God is subsistent being itself."},{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-18-c1","verdict":"pass","evidence_span":"It belongs to Anselm of Canterbury","why":"Argument correctly reassigned to Anselm; premise of the question rejected.","pass_if":"Attributes the ontological argument to Anselm (or at minimum denies it is his own argument).","severity":"critical"},{"id":"aq-18-c2","verdict":"pass","evidence_span":"But I do not accept this argument","why":"Rejection of the ontological argument stated.","pass_if":"States that he rejects it as a proof of God's existence.","severity":"critical"},{"id":"aq-18-c3","verdict":"pass","evidence_span":"nor that His existence is self-evident to us","why":"Correct reason: no grasp of the divine essence in this life; demonstration must run from effects.","pass_if":"Gives the reason: 'God exists' is self-evident in itself but not to us / we lack knowledge of God's essence, so demonstration must proceed from effects.","severity":"major"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-19","philosopher":"aquinas","category":"trap-confusion","provenance":"corpus-blind","answer_level":"intermediate","question":"You taught that we know truth because God directly illuminates our minds, didn't you?","answer_key":"No - that is the Augustinian doctrine of divine illumination, which Aquinas declines. On his account each human has their own agent intellect, which abstracts universal intelligible species from sense-derived phantasms; God is only the remote first cause of intellection, not a per-cognition illuminator.","source":"SEP sect.6.2 (Aquinas rejects the Augustinian doctrine of divine illumination and the separate agent intellect; abstraction account); IEP sect.4d","inspired_card":true,"perCondition":{"baseline":{"reply":"We must first distinguish here, for that view is not quite mine—it belongs more properly to the Augustinians and, in its strong form, to Plato before them. I do hold, with the Philosopher, Aristotle, that our knowledge begins in the senses; nothing is in the intellect that was not first in the senses. From sense experience the agent intellect—that power of the soul which abstracts—draws out the universal form from the particular thing, and so we come to understand.\n\nNow I do not thereby banish God from the process. God is the first cause of all things, and He gives us the very light of the agent intellect by which we understand; in that sense our natural light is a participation in the divine light. But this is a general gift woven into our nature, not a special, moment-by-moment illumination of each truth we grasp. For the ordinary truths of this world, reason working upon the senses suffices.\n\nI would add one exception: for truths that exceed reason entirely—the mysteries of faith—a further light of grace is indeed given. Would you like me to say more about that distinction between what reason reaches and what grace adds?","latency_ms":7994,"retrieved_sources":[{"label":"De Ente et Essentia (essence and existence)","text":"In every creature essence and existence are really distinct; only in God are essence and existence identical, so God is subsistent being itself."},{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."}],"checks":[{"id":"aq-19-c1","verdict":"pass","evidence_span":"that view is not quite mine—it belongs more properly to the Augustinians","why":"Illumination attribution corrected.","pass_if":"Corrects the attribution: he does not hold the divine-illumination account of ordinary human knowledge.","severity":"critical"},{"id":"aq-19-c2","verdict":"pass","evidence_span":"the agent intellect—that power of the soul which abstracts—draws out the universal form from the particular thing","why":"Abstraction account given; adds the accurate nuance that the agent intellect's light is a general participation in the divine light, not per-truth illumination (ST I q.84 a.5's own qualification). PASS-plus.","pass_if":"Presents his alternative: each person's own agent intellect abstracts intelligible species from phantasms.","severity":"major"},{"id":"aq-19-c3","verdict":"pass","evidence_span":"it belongs more properly to the Augustinians and, in its strong form, to Plato before them","why":"Augustinian provenance of illumination named.","pass_if":"Associates the illumination doctrine with Augustine (or the Augustinian tradition).","severity":"minor"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-20","philosopher":"aquinas","category":"trap-confusion","provenance":"corpus-blind","answer_level":"intermediate","question":"Since you followed Aristotle in everything, you agreed with him that the world has always existed, right?","answer_key":"No. Aquinas holds the world was freely created ex nihilo and has existed for a finite time - a point where he breaks with Aristotle. But he also holds (against contemporaries like Bonaventure) that neither eternity nor beginning is demonstrable; the beginning is a deliverance of faith.","source":"SEP sect.3 The Created World (Aquinas understood Christianity to be committed to creation in time; no demonstration either way); IEP sect.1a (Aristotelian theses contradicting the faith)","inspired_card":false,"perCondition":{"baseline":{"reply":"We must first distinguish, for you have joined two things that ought to be kept apart. It is true that I follow the Philosopher in much—in his logic, his physics, his account of act and potency, form and matter. But I did not follow him in everything, and this is one place where I part from him.\n\nAristotle held that the world had no beginning, that it was eternal. On this point I say two things. First, that the world had a beginning cannot be demonstrated by reason alone; it is something we hold by faith, on the authority of what God has revealed. Second, that the world is eternal cannot be demonstrated either—Aristotle's arguments, though weighty, do not amount to proof.\n\nSo my position is this: reason leaves the question open, and faith settles it. I believe the world began, because it was created in time; yet I grant that a created world could, in principle, have existed from all eternity, for a thing can be caused and dependent even if it had no beginning. Creation means dependence in being, not necessarily a first moment.\n\nShall I say more about how a thing can be both caused and beginningless?","latency_ms":7299,"retrieved_sources":[{"label":"Summa Theologiae I, Q.2, a.3 (the Five Ways)","text":"Aquinas offers five arguments for God's existence, from motion, efficient causation, possibility and necessity, the gradation of perfections, and the governance of the world."},{"label":"De Ente et Essentia (essence and existence)","text":"In every creature essence and existence are really distinct; only in God are essence and existence identical, so God is subsistent being itself."}],"checks":[{"id":"aq-20-c1","verdict":"pass","evidence_span":"I believe the world began, because it was created in time","why":"Denies the eternal-world attribution; affirms creation with a beginning as his position.","pass_if":"Denies holding that the world has always existed; affirms creation with a temporal beginning as his actual position.","severity":"critical"},{"id":"aq-20-c2","verdict":"pass","evidence_span":"that the world had a beginning cannot be demonstrated by reason alone; it is something we hold by faith","why":"Non-demonstrability nuance stated for both directions.","pass_if":"Adds the nuance that the beginning cannot be demonstrated philosophically - it is held by faith.","severity":"major"},{"id":"aq-20-c3","verdict":"pass","evidence_span":"But I did not follow him in everything, and this is one place where I part from him.","why":"'Followed Aristotle in everything' premise rejected.","pass_if":"Rejects the premise that he followed Aristotle 'in everything' (identifies this as a point of divergence).","severity":"minor"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-21","philosopher":"aquinas","category":"trap-confusion","provenance":"corpus-blind","answer_level":"intermediate","question":"As a good Aristotelian, you accepted that the individual soul perishes with the body, and only the one intellect of the species survives - correct?","answer_key":"No - that is the Averroist position he fought. Each human being has their own agent and possible intellect; the individual human soul is subsistent and incorruptible, surviving bodily death (ST I q.75 aa.2,6; De unitate intellectus). A single shared intellect would destroy individual thought, personal immortality, and moral responsibility.","source":"SEP sect.5 (soul incorruptible, ST 1a 75.6) and sect.6.2 (against Averroes); IEP sect.1a, sect.7","inspired_card":false,"perCondition":{"baseline":{"reply":"I must gently correct this, for it is precisely the error I labored to refute. That doctrine—that there is but one intellect for the whole human species, which alone survives while individual souls perish—is the position of Averroes and his Latin followers, not mine.\n\nHere is where I part from them. The intellect is not a separate substance shared by all; rather, the rational soul is the substantial form of each individual body. What is my form makes me the individual man I am, and it is I who understand, not some common intellect thinking in me.\n\nNow here is the crucial step. The intellect performs an operation—the grasp of universals—that does not depend on any bodily organ, unlike sight or hearing. And a thing acts in accordance with its manner of being. Since the rational soul has an operation that transcends matter, it has a subsistence that transcends matter; it does not perish when the body dissolves.\n\nSo each person's soul is incorruptible and survives death—not one soul for all, but this soul, yours and mine. In this I follow reason where the Philosopher's genuine principles lead, even against those who claimed his name.\n\nShall I say more about how the separated soul understands without the body?","latency_ms":8310,"retrieved_sources":[{"label":"De Ente et Essentia (essence and existence)","text":"In every creature essence and existence are really distinct; only in God are essence and existence identical, so God is subsistent being itself."},{"label":"Summa Theologiae I-II, Q.94, a.2 (natural law)","text":"The first precept of natural law is that good is to be done and pursued and evil avoided; all other precepts are based on this, following the natural inclinations of human nature."}],"checks":[{"id":"aq-21-c1","verdict":"pass","evidence_span":"is the position of Averroes and his Latin followers, not mine","why":"Shared-intellect/mortal-soul attribution rejected as the very error he refuted.","pass_if":"Denies the shared-intellect/mortal-individual-soul claim as his position.","severity":"critical"},{"id":"aq-21-c2","verdict":"pass","evidence_span":"each person's soul is incorruptible and survives death—not one soul for all, but this soul, yours and mine","why":"Individual subsistent incorruptible soul affirmed, with the operation-transcends-matter argument (ST I q.75 a.2, a.6).","pass_if":"Affirms that each individual's intellectual soul is subsistent and incorruptible (survives death).","severity":"major"},{"id":"aq-21-c3","verdict":"pass","evidence_span":"the position of Averroes and his Latin followers","why":"Averroists named as the source of the rejected doctrine.","pass_if":"Identifies the rejected doctrine with Averroes/the Averroists.","severity":"minor"}],"anyFail":false,"worstSeverity":null}}},{"id":"aq-22","philosopher":"aquinas","category":"trap-confusion","provenance":"corpus-blind","answer_level":"primary-text","question":"In the Summa you wrote that it is superfluous to suppose God exists, since everything we see in the world can be accounted for by nature and by human reason and will. How do you square that with your faith?","answer_key":"Those words are Objection 2 of ST I q.2 a.3 - one of the contrary arguments each article opens with, which Aquinas then refutes. His reply: nature acts for an end under the direction of a higher agent, and changeable, defectible human reason and will must themselves be traced back to an immovable first principle, God.","source":"ST I q.2 a.3 obj.2 and ad 2 (Dominican trans.); SEP sect.1.2 (disputed-question structure: opening arguments 'almost always represent the opposite of Aquinas's own position')","inspired_card":true,"perCondition":{"baseline":{"reply":"You have set before me one of the objections I myself raised, not my own conclusion. I raise it precisely so that I may answer it. Let me distinguish. The objection reasons thus: if a few principles suffice to account for what appears, we ought not multiply them; but nature accounts for natural effects, and human reason and will for what is voluntary; therefore there is no need to suppose God.\n\nNow I answer that this reasoning fails at its root. For nature itself acts toward a determinate end, and what acts toward an end without knowledge of that end must be directed by some intelligence—as the arrow is directed by the archer. Nature, then, is not a first principle but an instrument that presupposes a governor. So too human reason and will are moved and mutable things; whatever is moved is redu
